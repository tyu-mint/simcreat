<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#f6f5f1">
  <title>欢迎来到办卡服务入口 · ICET</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #20231f;
      background: #f6f5f1;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
      overflow-x: hidden;
      background:
        radial-gradient(ellipse at 12% 8%, rgba(207, 222, 190, .52), transparent 38%),
        radial-gradient(ellipse at 92% 88%, rgba(229, 213, 183, .48), transparent 36%),
        #f6f5f1;
    }
    .page { width: min(100%, 460px); }
    .topline {
      display: flex; align-items: center; justify-content: space-between;
      margin: 0 2px 30px;
      color: #70756c; font-size: 11px; letter-spacing: .16em; font-weight: 700;
    }
    .brand { display: inline-flex; align-items: center; gap: 9px; color: #292e27; }
    .brand-mark {
      display: grid; place-items: center; width: 28px; height: 28px; border-radius: 9px;
      background: #28372b; color: #f8f7f1; font-size: 13px; letter-spacing: 0;
    }
    .status { display: inline-flex; align-items: center; gap: 7px; letter-spacing: .04em; }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: #7c986b; box-shadow: 0 0 0 3px rgba(124,152,107,.14); }
    .panel {
      position: relative; overflow: hidden;
      padding: clamp(28px, 7vw, 42px);
      border: 1px solid rgba(45, 54, 42, .10);
      border-radius: 28px;
      background: rgba(255, 255, 252, .82);
      box-shadow: 0 24px 70px rgba(48, 51, 42, .08), 0 2px 8px rgba(48, 51, 42, .03);
      backdrop-filter: blur(16px);
    }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 7px 10px; border-radius: 999px;
      background: #edf0e8; color: #4d6247;
      font-size: 10px; font-weight: 750; letter-spacing: .13em;
    }
    h1 {
      margin: 25px 0 14px; max-width: 340px;
      font-size: clamp(34px, 9vw, 43px); line-height: 1.18;
      letter-spacing: -.055em; font-weight: 760;
    }
    h1 span { color: #718667; }
    .intro { margin: 0; color: #73776f; font-size: 14px; line-height: 1.9; }
    .rule { height: 1px; margin: 28px 0 22px; background: #e9e9e1; }
    .destination { display: flex; align-items: center; gap: 13px; margin-bottom: 24px; }
    .destination-icon {
      display: grid; place-items: center; flex: 0 0 44px; height: 44px;
      border-radius: 14px; background: #f0f0e9; color: #465641;
    }
    .destination-title { margin: 0 0 4px; font-size: 13px; font-weight: 700; }
    .destination-sub { margin: 0; color: #898c84; font-size: 11px; line-height: 1.5; }
    .enter {
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      width: 100%; min-height: 58px; padding: 0 19px;
      border: 0; border-radius: 16px;
      background: #28372b; color: #fffdf6;
      font: inherit; font-size: 14px; font-weight: 700; text-decoration: none;
      transition: transform .18s ease, background .18s ease, box-shadow .18s ease;
      box-shadow: 0 8px 18px rgba(40, 55, 43, .14);
      -webkit-tap-highlight-color: transparent;
    }
    .enter:hover { background: #354a38; box-shadow: 0 10px 24px rgba(40,55,43,.19); }
    .enter:active { transform: scale(.985); }
    .arrow { font-size: 20px; font-weight: 400; line-height: 1; }
    .notice { display: flex; gap: 8px; margin: 18px 1px 0; color: #898c84; font-size: 11px; line-height: 1.75; }
    .notice svg { flex: 0 0 14px; margin-top: 2px; }
    .footer { margin-top: 22px; text-align: center; color: #96988f; font-size: 10px; letter-spacing: .08em; }
    a:focus-visible { outline: 3px solid #91a784; outline-offset: 4px; }
    @media (max-width: 360px) {
      body { padding-left: 14px; padding-right: 14px; }
      .topline { margin-bottom: 20px; }
      .panel { padding: 25px 22px; border-radius: 24px; }
      h1 { font-size: 34px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="topline">
      <div class="brand"><span class="brand-mark">i.</span><span>ICET / ACCESS</span></div>
      <div class="status"><span class="dot" aria-hidden="true"></span><span>ONLINE</span></div>
    </header>

    <section class="panel" aria-labelledby="welcome-title">
      <div class="eyebrow"><span aria-hidden="true">✳</span> CARD SERVICES · 入口导航</div>
      <h1 id="welcome-title">欢迎来到<br><span>办卡服务入口。</span></h1>
      <p class="intro">从这里进入办卡店铺，查看当前可办理的卡种与相关信息。整个流程简单直接，具体办理规则以平台页面为准。</p>

      <div class="rule" aria-hidden="true"></div>

      <div class="destination">
        <div class="destination-icon" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
            <rect x="3" y="5" width="18" height="14" rx="3" stroke="currentColor" stroke-width="1.6"/>
            <path d="M3 10h18M7 15h4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
        </div>
        <div>
          <p class="destination-title">办卡店铺</p>
          <p class="destination-sub">下一步将进入第三方平台页面</p>
        </div>
      </div>

      <a class="enter" href="https://tui.haozhuan.vip/#/pages/micro_store/index?agent_id=78b089b27672cc0a2210db56129c38e0">
        <span>进入办卡店铺</span>
        <span class="arrow" aria-hidden="true">↗</span>
      </a>

      <p class="notice">
        <svg viewBox="0 0 16 16" width="14" height="14" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="6.2" stroke="currentColor" stroke-width="1.3"/><path d="M8 7v3.5M8 4.8h.01" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        <span>后续页面由第三方平台提供。办理条件、资费、优惠及个人信息处理规则，请以平台公示内容为准。</span>
      </p>
    </section>

    <footer class="footer">A SIMPLE WAY TO GET STARTED · ICET.UK</footer>
  </main>
</body>
</html>
